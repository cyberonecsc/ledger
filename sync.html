<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERONE CSC - Ledger Data Sync Provider</title>
</head>
<body style="background: #0f172a; color: #cbd5e1; font-family: sans-serif; text-align: center; padding: 40px 20px;">
  <div style="max-width: 400px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    <h3 style="margin-top: 0; color: #38bdf8;">Data Sync Bridge</h3>
    <p style="font-size: 13px; line-height: 1.5; color: #94a3b8;">This page securely transmits your browser's encrypted ledger database to your running local server.</p>
    <div style="font-size: 11px; color: #64748b; margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px;">
      Origin Authorization: Localhost Only
    </div>
  </div>

  <script>
    // Listen for data sync requests from localhost
    window.addEventListener('message', function(event) {
      // Validate that the request is coming from localhost (any port) or 127.0.0.1
      var isLocalhost = /^http:\/\/localhost(:\d+)?$/.test(event.origin) || 
                        /^http:\/\/127\.0\.0\.1(:\d+)?$/.test(event.origin);
      
      if (isLocalhost) {
        if (event.data === 'request_sync_data') {
          var backup = {};
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && key.startsWith('cyberone_v2_')) {
              backup[key] = localStorage.getItem(key);
            }
          }
          // Send the database backup payload back to the localhost requester
          event.source.postMessage({ 
            type: 'sync_data_response', 
            data: backup 
          }, event.origin);
        } else if (event.data && event.data.type === 'write_sync_data') {
          var payload = event.data.data;
          if (payload) {
            for (var key in payload) {
              if (payload.hasOwnProperty(key) && key.startsWith('cyberone_v2_')) {
                localStorage.setItem(key, payload[key]);
              }
            }
            // Send back confirmation acknowledgment
            event.source.postMessage({ 
              type: 'sync_write_response', 
              success: true 
            }, event.origin);
          }
        }
      }
    });
  </script>
</body>
</html>
